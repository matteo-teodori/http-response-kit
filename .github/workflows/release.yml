name: Release

# Publishes to npm via OIDC Trusted Publishing when a version tag (v*) is pushed.
#
# One-time setup on npmjs.com (no token/secret needed):
#   Package -> Settings -> Trusted Publisher -> GitHub Actions
#   - Organization or user: matteo-teodori
#   - Repository:           http-response-kit
#   - Workflow filename:    release.yml
#   - Allowed actions:      npm publish
#
# Provenance is generated automatically with trusted publishing.
# Requires npm >= 11.5.1 (bundled with Node 24).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run ci
      - run: npm publish
