name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What can't you do today, or what is awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the API you would like to see.
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
